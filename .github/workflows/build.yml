name: Build Nexora Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        # Changed this line to point to your subfolder
        run: chmod +x ./gradlew || chmod +x ./NexoraClient/gradlew

      - name: Build with Gradle
        # Changed this line to run from the correct directory
        run: ./gradlew build || (cd NexoraClient && ./gradlew build)

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Client-Build
          path: "**/build/libs/*.jar"
          
