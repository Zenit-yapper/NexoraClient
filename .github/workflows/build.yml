name: Build Nexora Client
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8' # Forces the runner to use Gradle 8.8

      - name: Build with Gradle
        # Runs the build using the version of Gradle we just set up
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Client-Build
          path: "**/build/libs/*.jar"
          
